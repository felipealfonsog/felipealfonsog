name: Spotify Telemetry (CLI feed)
# v4.0

on:
  workflow_dispatch:
  schedule:
    # Cada 2 horas, minuto 23 — 12 ejecuciones diarias
    # Optimizado para captura y persistencia de telemetría histórica
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: spotify-telemetry
  cancel-in-progress: false

jobs:
  telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Spotify telemetry block
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/spotify_telemetry.py

      - name: Commit and push telemetry if changed
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No telemetry changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # README telemetry + persistent telemetry state/history
          git add README.md
          git add .github/state/spotify_last_report.json 2>/dev/null || true
          git add .github/state/spotify_listening_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit -m "chore: update Spotify telemetry (CLI feed)"
          git push

      # Debug artifact is only retained when the workflow fails.
      - name: Upload Spotify debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-debug
          path: .github/state/spotify_debug.json
          if-no-files-found: ignore
